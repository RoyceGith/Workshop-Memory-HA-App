name: Workshop Deploy Agent
version: "0.1.2"
slug: workshop_deploy_agent
description: Trusted deployment agent for Workshop Memory server updates
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ports:
  3010/tcp: 3010
ports_description:
  3010/tcp: Workshop deploy-agent HTTP endpoint
map:
  - type: share
    read_only: false
options:
  repo_path: "/share/Workshop-Memory-HA-App"
  deploy_agent_token: null
  git_remote_url: "git@github.com:RoyceGith/Workshop-Memory-HA-App.git"
  git_ssh_key_path: "/share/workshop-deploy-agent/id_ed25519"
schema:
  repo_path: str
  deploy_agent_token: password
  git_remote_url: str
  git_ssh_key_path: str
